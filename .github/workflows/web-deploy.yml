name: Web Deployment

# web.staircrusher.club (S3 staircrusher-club-web + CloudFront E3RDKBHB12EC6A) 배포.
# 로컬 `aws-vault exec swann-scc -- ./web-deploy.sh` 경로는 그대로 살아 있고,
# 이 워크플로는 AWS 자격증명이 없는 사람도 배포할 수 있도록 OIDC 로 같은 스크립트를 돌린다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "배포하려면 deploy 라고 입력하세요"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# --delete sync 라 동시 실행이 겹치면 서로의 산출물을 지운다.
concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 오발사 방지 — confirm 입력 확인
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::confirm 입력이 'deploy' 가 아닙니다 (입력값: '$CONFIRM'). 배포를 중단합니다."
            exit 1
          fi

      # 배포는 항상 origin/main 기준 (로컬 배포에도 같은 규칙이 걸려 있다).
      - name: main 브랜치 확인
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::웹 배포는 main 에서만 실행합니다 (현재: ${{ github.ref }})."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.SCC_FRONTEND_BUILD_CONFIGURATIONS_SSH_KEY }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # webpack(SPA) + generate-og-pages.js(뿌클로드 prerender) + build-articles.js(정적 아티클).
      # 세 표면이 한 번에 나와야 아래 --delete sync 가 안전하다.
      - name: Build web bundle
        run: yarn web:build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::291889421067:role/github-action-ci-cd
          aws-region: ap-northeast-2

      # 산출물 3표면 검증 → S3 sync(--delete) → 진입파일 no-cache → CloudFront 무효화.
      # 검증은 스크립트 안에 있으므로 로컬 배포도 같은 게이트를 통과한다.
      - name: Deploy to S3 + invalidate CloudFront
        run: ./web-deploy.sh

      - name: Verify production surfaces
        run: |
          # CloudFront 전파 대기. 존재하지 않는 경로도 SPA fallback 을 200 으로 돌려주므로
          # http_code 가 아니라 표면별 <title> 마커로 판정한다.
          sleep 30
          check() {
            local url="$1" marker="$2"
            local body
            body=$(curl -fsS -H 'Cache-Control: no-cache' "$url") || {
              echo "::error::$url 요청 실패"; return 1;
            }
            if ! printf '%s' "$body" | grep -qF "$marker"; then
              echo "::error::$url 응답에 마커 '$marker' 가 없습니다."
              return 1
            fi
            echo "OK  $url"
          }
          rc=0
          check https://web.staircrusher.club/ '<title>계단뿌셔클럽</title>' || rc=1
          check https://web.staircrusher.club/bbucle-road/ '<title>뿌클로드 | 계단뿌셔클럽</title>' || rc=1
          check https://web.staircrusher.club/articles/ '<title>아티클 | 계단뿌셔클럽</title>' || rc=1
          exit $rc

      # 이 워크플로는 AWS 를 모르는 사람이 돌린다. 실패했을 때 "내가 뭘 잘못 눌렀나" 로
      # 헤매지 않도록, 원인 추정과 개발자에게 그대로 붙여넣을 요청문을 실행 요약에 남긴다.
      - name: 실패 시 안내
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## 웹 배포가 실패했습니다"
            echo
            echo "**여러분이 잘못 누른 것이 아닙니다.** 프로덕션 웹사이트는 그대로입니다"
            echo "— 실패하면 업로드 자체가 시작되지 않습니다."
            echo
            echo "위 로그에 \`AccessDenied\` 또는 \`s3:ListBucket\` 이 보이면 **AWS 권한 문제**입니다."
            echo "아래 상자 안 내용을 그대로 복사해서 개발자에게 전달해 주세요."
            echo
            echo '```'
            echo "scc-app 의 Web Deployment 워크플로가 AWS 권한 부족으로 실패했습니다."
            echo "github-action-ci-cd role 에 다음 권한이 필요합니다:"
            echo "  - staircrusher-club-web 버킷: s3:ListBucket / GetObject / PutObject / DeleteObject"
            echo "  - CloudFront E3RDKBHB12EC6A: cloudfront:CreateInvalidation"
            echo "정책은 scc-server 의 infra/terraform/iam/github-action.tf 에 있고,"
            echo "로컬에서 aws-vault 로 terraform apply 해야 반영됩니다."
            echo "실패한 실행: $RUN_URL"
            echo '```'
            echo
            echo "\`AccessDenied\` 가 안 보이면 빌드나 검증 단계에서 멈춘 것입니다."
            echo "로그에서 ❌ 로 시작하는 줄을 찾아, 그 줄과 위 실행 링크를 개발자에게 전달해 주세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on Success
        if: success()
        run: |
          CURRENT_GITHUB_ACTION_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H 'Content-type: application/json' --data "{\"attachments\":[{\"color\":\"#0000FF\",\"title\":\"✅ 계단정복지도 웹 배포 완료\", \"text\":\"https://web.staircrusher.club\n배포 ref: ${{ github.sha }} (<$CURRENT_GITHUB_ACTION_RUN_URL|배포 상세보기>)\"}]}" ${{ secrets.SCC_APP_DEPLOY_NOTICE_SLACK_URL }}

      - name: Notify Slack on Failure
        if: failure()
        run: |
          CURRENT_GITHUB_ACTION_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H 'Content-type: application/json' --data "{\"attachments\":[{\"color\":\"#FF0000\",\"title\":\"[PROD] Scc-App Web Deployment Failed\", \"text\":\"<!subteam^S052B9WNGCV> 배포 ref: ${{ github.sha }} (<$CURRENT_GITHUB_ACTION_RUN_URL|github action run url>)\"}]}" ${{ secrets.SLACK_URL_SCC_SERVER_CHANNEL }}
